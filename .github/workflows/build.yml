name: Build

on:
  push:
    branches: [ main, master, '*-dev' ]
  pull_request:
    branches: [ main, master, '*-dev' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew collectBuilds build --stacktrace

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tebex-plugin
          path: builds/*.jar
