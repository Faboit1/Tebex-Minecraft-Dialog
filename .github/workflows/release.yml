name: Release

# Publishes a GitHub release with the built jars attached whenever a v* tag is pushed,
# so a release is something people can download rather than just a marker in the history.
on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew collectBuilds build --stacktrace -x test --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tebex-plugin
          path: builds/*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: builds/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
