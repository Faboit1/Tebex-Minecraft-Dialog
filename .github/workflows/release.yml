name: Release

# Publishes a GitHub release with the built jars attached whenever a v* tag is pushed,
# so a release is something people can download rather than just a marker in the history.
on:
  push:
    tags: [ 'v*' ]
  # Lets a release be cut without pushing a tag locally. The tag is created by the
  # release step at the checked-out commit, using the workflow token.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v2.5.0. Created if it does not exist.'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew collectBuilds build --stacktrace -x test --no-daemon

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tebex-plugin
          path: builds/*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # github.ref_name is the tag on a tag push, and the branch on a manual run,
          # so the input takes precedence when one was given.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: builds/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
