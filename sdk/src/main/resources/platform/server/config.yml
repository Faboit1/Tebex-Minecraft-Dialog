# Tebex v${version} - https://tebex.io
# Check out https://docs.tebex.io/creators/tebex-control-panel/game-servers/minecraft-java-edition if you need help.

# Buy Command
# This is the command that players will use to open the Tebex GUI.
buy-command:
  enabled: true
  name: buy

# How often (in seconds) to check for new purchases.
# Lower values mean faster delivery but more API requests.
# Default: 3
check-interval: 3

# Whether to check for updates or not.
check-for-updates: true

# Messages sent to players.
# Supports MiniMessage tags (<green>, <bold>, <gradient:red:blue>) and & colour codes.
# %url% is the checkout link, %player% is the player's name.
messages:
  checkout: "<green>Checkout started! Complete payment here: <yellow>%url%"
  # Sent instead to Bedrock players, who cannot click links in chat.
  checkout-bedrock: "<green>Checkout started! Type this link into your browser: <yellow>%url%"

# Free package settings.
# A package counts as free when its price (after any sale) is 0.
free-packages:
  # Cooldown in seconds applied to every free package that has no entry under
  # 'cooldowns' below. 0 means free packages can always be claimed.
  default-cooldown: 0

  # Per-package cooldowns in seconds, keyed by the Tebex package ID.
  # The package ID is shown in the URL when you edit a package in the Tebex panel.
  # Common values: 3600 = 1 hour, 43200 = 12 hours, 86400 = 24 hours.
  cooldowns: {}
  #  1234567: 43200

  # Reminds online players when they have free packages waiting for them.
  reminder:
    enabled: true
    interval-minutes: 10
    message: "<green>You have free items waiting! Use <yellow>/buy<green> to claim them."

# Automatic reporting of exceptions to Tebex
auto-report-enabled: true

# Debug Mode
verbose: false

# GUI Settings
gui:
  menu:
    home:
      title: "Server Shop"
      rows: 3
    category:
      title: "Viewing %category%"
      rows: 3
    sub-category:
      title: "Viewing %sub_category% (%category%)"
      rows: 1
  dialog:
    enabled: true
    sprites: true
    # Sprites need MC 1.21.9+, so they are skipped on older servers. Set this to false
    # to send them anyway — useful for checking whether a fork is reporting its version
    # in a way the check does not recognise. Run /tebex debug true to log what it saw.
    sprite-version-check: true
    # Logs the exact dialog JSON and the detected server version every time a shop
    # dialog opens. Useful for diagnosing missing sprites without turning on full
    # debug logging, which the purchase queue check floods.
    log-json: false
    button-width: 200
    columns: 1
    body-text: "Please select a category:"
    category-body-text: "Select a package to purchase:"
    close-button: "Close"
    back-button: "« Back"
    subcategory-prefix: "[+] "
    free-marker: "<red>[FREE]<reset> "
    free-text: "Free"
    sale-suffix: "(Sale)"
    sale-color: "<yellow>"
    price-format: "%currency%%price%"
    free-on-cooldown-format: "%currency%0"
    # Text shown when hovering a button. Store descriptions are used when available,
    # but the Tebex API does not return them for every store, so you can set the text
    # yourself here keyed by category or package ID.
    tooltips:
      enabled: true
      categories: {}
      #  98765: "Our best deals"
      packages: {}
      #  1234567: "Claimable once every 12 hours"
  item:
    back:
      name: "&cBack"
      material: COMPASS
      lore: []
    category:
      name: "&b%category%"
      material: CHEST
      lore:
        - "&7Click to view packages!"
    package-sale:
      name: "&b%package_name%"
      material: PAPER
      lore:
        - "&7Price: &f%package_currency%%package_sale_price% &7(&m%package_currency%%package_price%&r&7)"
        - "&7"
        - "&7Click to purchase!"
    package:
      name: "&b%package_name%"
      material: PAPER
      lore:
        - "&7Price: &f%package_currency%%package_price%"
        - "&7"
        - "&7Click to purchase!"

# These settings are exclusive to this server.
# Do not share these credentials with anyone.
server:
  # Proxy Mode
  # If you are using BungeeCord/Velocity, set this to true.
  proxy: false

  # Secret Key
  # This is used to identify your server.
  secret-key: ''

# Configuration Version
# !! Do not change this value !!
config-version: 2