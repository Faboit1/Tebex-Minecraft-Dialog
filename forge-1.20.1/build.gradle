import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

def gitCommitHash() {
    try {
        def process = new ProcessBuilder("git", "rev-parse", "--short", "HEAD")
                .redirectErrorStream(true)
                .start()
        def result = process.inputStream.text.trim()
        process.waitFor()
        return process.exitValue() == 0 ? result : "unknown"
    } catch (Exception ignored) {
        return "unknown"
    }
}

plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

group = rootProject.group
version = rootProject.version
def tebexGitCommitHash = gitCommitHash()

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    mods {
        tebex {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    shadow project(':sdk')
    compileOnly 'dev.dejvokep:boosted-yaml:1.3'
}

tasks.named('processResources', ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: rootProject.version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('shadowJar', ShadowJar) {
    configurations = [project.configurations.shadow]
    archiveBaseName.set("tebex-${project.name}")
    archiveVersion.set("${rootProject.version}-${tebexGitCommitHash}")
    archiveClassifier.set("")

    relocate 'okhttp3', 'io.tebex.plugin.libs.okhttp3'
    relocate 'okio', 'io.tebex.plugin.libs.okio'
    relocate 'dev.dejvokep.boostedyaml', 'io.tebex.plugin.libs.boostedyaml'
    relocate 'org.jetbrains.annotations', 'io.tebex.plugin.libs.jetbrains'
    relocate 'kotlin', 'io.tebex.plugin.libs.kotlin'
    relocate 'com.google.gson', 'io.tebex.plugin.libs.gson'
    minimize()
}

obfuscation {
    reobfuscate(tasks.named('shadowJar'), sourceSets.main)
}

tasks.named('jar') {
    dependsOn tasks.named('shadowJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
